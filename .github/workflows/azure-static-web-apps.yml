name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      # development is the Azure dev app. NOT main — main is the LEGACY single-file
      # page estimators use today, and pointing this workflow at it would aim a Vite
      # build at a repo that has none.
      - development
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - development

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # staticwebapp.config.json cannot reference app settings for openIdIssuer,
      # so the tenant id is substituted here from a repo secret instead of being
      # hardcoded in source.
      - name: Inject Entra tenant id into SWA config
        run: |
          if [ -z "${{ secrets.AAD_TENANT_ID }}" ]; then
            echo "::error::AAD_TENANT_ID secret is not set"; exit 1
          fi
          sed -i "s|<TENANT_ID>|${{ secrets.AAD_TENANT_ID }}|g" staticwebapp.config.json

      - name: Build and deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          # EMPTY ON PURPOSE. This Static Web App uses a LINKED backend (a real Function
          # App), and in that mode the SWA action does NOT deploy the API — it ignores
          # api_location silently. Leaving it set produced a green build with no API
          # deployed at all: every route resolved zero roles, and every user got 403
          # after a successful sign-in. The API is deployed by the job below.
          api_location: ''
          output_location: 'dist'

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

  deploy_api:
    name: Deploy the linked Function App
    # The Static Web App and the API are two resources, so they are two deploys. The
    # SWA action only ships dist/; without this job the site goes live pointing at an
    # API that does not exist, which presents as a 403 for every signed-in user
    # rather than as a failed deployment.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life on 2026-04-30. The Function App runs Node 22;
          # building on the version it runs on avoids shipping something the host
          # cannot load.
          node-version: 22

      - name: Check the publish profile is configured
        # Without this the failure is actively misleading. functions-action treats an
        # empty publish-profile as "use RBAC instead", then fails with "No credentials
        # found. Add an Azure login action before this action" — which sends you off to
        # set up OIDC federation when the real fix is one repository secret.
        run: |
          if [ -z "${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" ]; then
            echo "::error::AZURE_FUNCTIONAPP_PUBLISH_PROFILE is not set. Get it with:"
            echo "::error::az functionapp deployment list-publishing-profiles -n p1sse-api-dev -g LegaC-SSE-Development --xml"
            exit 1
          fi
      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: p1sse-api-dev
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          # REQUIRED on Linux Consumption. That plan has no writable wwwroot — it runs
          # exclusively from a mounted package — so a plain ZipDeploy fails with
          # "Failed to deploy web package to App Service" after appearing to upload
          # fine. These two switch the action to the remote-build flow, which builds
          # with Oryx and sets the package pointer the host actually reads.
          scm-do-build-during-deployment: true
          enable-oryx-build: true
