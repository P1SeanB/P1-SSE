name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      # development is the Azure dev app. NOT main — main is the LEGACY single-file
      # page estimators use today, and pointing this workflow at it would aim a Vite
      # build at a repo that has none.
      - development
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - development

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # staticwebapp.config.json cannot reference app settings for openIdIssuer,
      # so the tenant id is substituted here from a repo secret instead of being
      # hardcoded in source.
      - name: Inject Entra tenant id into SWA config
        run: |
          if [ -z "${{ secrets.AAD_TENANT_ID }}" ]; then
            echo "::error::AAD_TENANT_ID secret is not set"; exit 1
          fi
          sed -i "s|<TENANT_ID>|${{ secrets.AAD_TENANT_ID }}|g" staticwebapp.config.json

      - name: Build and deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: 'api'
          output_location: 'dist'

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
