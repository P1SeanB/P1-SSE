name: Deploy to Azure Static Web Apps

# TWO Azure resources, so two jobs. The Static Web App serves dist/; the linked
# Function App serves /api. They deploy by different mechanisms and fail
# independently, which is why the job names say which resource each one touches —
# "Build and deploy" told you neither.

on:
  push:
    branches:
      # development is the Azure dev app; production is the live one. NOT main — main
      # is the LEGACY single-file page estimators use today, and pointing this workflow
      # at it would aim a Vite build at a repo that has none.
      - development
      - production
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - development

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Front end -> Static Web App (${{ github.ref == 'refs/heads/production' && 'p1sse-swa-prod' || 'p1sse-swa-dev' }})
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not write the job token into .git/config. Nothing here needs git
          # credentials after checkout, and persisting them causes the recurring
          # "Failed to remove http.https://github.com/.extraheader" warning: the SWA
          # action builds through a container that alters the workspace, so the
          # checkout post-step can no longer unset what it set. Harmless on an
          # ephemeral runner, but not writing the token is better than tidying it up.
          persist-credentials: false
          submodules: true

      # staticwebapp.config.json cannot reference app settings for openIdIssuer,
      # so the tenant id is substituted here from a repo secret instead of being
      # hardcoded in source.
      # ONE place decides which environment this run targets. The alternative — a
      # ${{ github.ref == ... }} ternary at each use — drifts the moment someone adds a
      # reference and copies the wrong half of it.
      - name: Resolve the target environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "name=prod"            >> "$GITHUB_OUTPUT"
            echo "swa=p1sse-swa-prod"   >> "$GITHUB_OUTPUT"
            echo "api=p1sse-api-prod"   >> "$GITHUB_OUTPUT"
          else
            echo "name=dev"             >> "$GITHUB_OUTPUT"
            echo "swa=p1sse-swa-dev"    >> "$GITHUB_OUTPUT"
            echo "api=p1sse-api-dev"    >> "$GITHUB_OUTPUT"
          fi
          echo "Targeting $(cat "$GITHUB_OUTPUT" | grep '^name=' | cut -d= -f2)"

      - name: Inject the Entra tenant id into staticwebapp.config.json
        run: |
          if [ -z "${{ secrets.AAD_TENANT_ID }}" ]; then
            echo "::error::AAD_TENANT_ID secret is not set"; exit 1
          fi
          sed -i "s|<TENANT_ID>|${{ secrets.AAD_TENANT_ID }}|g" staticwebapp.config.json

      - name: Check the production token is configured
        if: steps.env.outputs.name == 'prod'
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN_PROD is not set. Without it this"
            echo "::error::run would deploy production's content to the DEV site and report success."
            echo "::error::Get it with: az staticwebapp secrets list -n p1sse-swa-prod -g LegaC-SSE-Production --query properties.apiKey -o tsv"
            exit 1
          fi

      - name: Build dist/ and upload to the Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Each Static Web App has its own deployment token, so the secret is chosen
          # by environment. A production run must never be able to fall back to the dev
          # token: it would deploy the live site's content to dev and report success.
          azure_static_web_apps_api_token: ${{ steps.env.outputs.name == 'prod' && secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          # EMPTY ON PURPOSE. This Static Web App uses a LINKED backend (a real Function
          # App), and in that mode the SWA action does NOT deploy the API — it ignores
          # api_location silently. Leaving it set produced a green build with no API
          # deployed at all: every route resolved zero roles, and every user got 403
          # after a successful sign-in. The API is deployed by the job below.
          api_location: ''
          output_location: 'dist'

      # The Actions page otherwise shows two job names and leaves you to work out
      # which Azure resource each one touched. This says it outright.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Front end — Static Web App"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Resource | \`${{ steps.env.outputs.swa }}\` (${{ steps.env.outputs.name }}) |"
            echo "| Ships | the built \`dist/\` plus staticwebapp.config.json |"
            echo "| URL | ${{ steps.deploy.outputs.static_web_app_url }} |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "The API is a separate resource deployed by the other job."
          } >> "$GITHUB_STEP_SUMMARY"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Tear down the PR preview environment
    steps:
      - name: Close the preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

  deploy_api:
    name: API -> Function App (${{ github.ref == 'refs/heads/production' && 'p1sse-api-prod' || 'p1sse-api-dev' }})
    permissions:
      # Required for OIDC: without id-token:write the login step cannot request a
      # token and fails with a permissions error that reads like a role problem.
      id-token: write
      contents: read
    # The Static Web App and the API are two resources, so they are two deploys. The
    # SWA action only ships dist/; without this job the site goes live pointing at an
    # API that does not exist, which presents as a 403 for every signed-in user
    # rather than as a failed deployment.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not write the job token into .git/config. Nothing here needs git
          # credentials after checkout, and persisting them causes the recurring
          # "Failed to remove http.https://github.com/.extraheader" warning: the SWA
          # action builds through a container that alters the workspace, so the
          # checkout post-step can no longer unset what it set. Harmless on an
          # ephemeral runner, but not writing the token is better than tidying it up.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life on 2026-04-30. The Function App runs Node 22;
          # building on the version it runs on avoids shipping something the host
          # cannot load.
          node-version: 22

      # OIDC, not a publish profile. FLEX CONSUMPTION DOES NOT SUPPORT PUBLISH
      # PROFILES AT ALL — asking for one returns "Invalid command. This is not
      # currently supported for Azure Functions on the Flex Consumption plan", and
      # since that error goes to stdout, piping it into a secret stores the error text
      # as though it were a credential. Nothing downstream notices.
      #
      # GitHub proves this workflow's identity with a short-lived token instead, so
      # there is no credential in the repository to leak or rotate. Matches how
      # F.R.E.D deploys.
      # ONE place decides which environment this run targets. The alternative — a
      # ${{ github.ref == ... }} ternary at each use — drifts the moment someone adds a
      # reference and copies the wrong half of it.
      - name: Resolve the target environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "name=prod"            >> "$GITHUB_OUTPUT"
            echo "swa=p1sse-swa-prod"   >> "$GITHUB_OUTPUT"
            echo "api=p1sse-api-prod"   >> "$GITHUB_OUTPUT"
          else
            echo "name=dev"             >> "$GITHUB_OUTPUT"
            echo "swa=p1sse-swa-dev"    >> "$GITHUB_OUTPUT"
            echo "api=p1sse-api-dev"    >> "$GITHUB_OUTPUT"
          fi
          echo "Targeting $(cat "$GITHUB_OUTPUT" | grep '^name=' | cut -d= -f2)"

      - name: Sign in to Azure (OIDC, no stored credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish the API to the Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.env.outputs.api }}
          package: api
          # The app is FLEX CONSUMPTION, so dependencies are built on the server and
          # the package is published to a blob container using the app's managed
          # identity — no account key, which is what makes this work at all against a
          # storage account with shared-key access disabled.
          #
          # scm-do-build-during-deployment / enable-oryx-build are the CONSUMPTION
          # (Y1) knobs and do not belong here.
          remote-build: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### API — Function App"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Resource | \`${{ steps.env.outputs.api }}\` (${{ steps.env.outputs.name }}, Flex Consumption) |"
            echo "| Serves | /api/* for the Static Web App, as a linked backend |"
            echo "| Auth | OIDC — no credential stored in this repository |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "Note: \`az functionapp function list\` returns EMPTY for the v4 model"
            echo "even on success — handlers register in code, not as function.json folders."
          } >> "$GITHUB_STEP_SUMMARY"
