name: Refresh the lockfile

# Regenerate package-lock.json on LINUX and commit it.
#
# WHY THIS CANNOT BE DONE LOCALLY. The lockfile was generated on Windows, where npm
# resolves a tree that omits what a Linux install needs: `npm ci` on the runner fails
# with "Missing @emnapi/core@1.11.3 from lock file" while passing on a clean Windows
# tree. Regenerating on Windows does not fix it and made it worse in testing —
# @emnapi/runtime disappeared entirely and core resolved to 1.11.1, not the 1.11.3 the
# runner asked for. The platform that needs the entries is the platform that has to
# resolve them.
#
# It opens a PULL REQUEST rather than pushing to the branch, because a lockfile change
# alters what every future build installs and deserves the same review as any other
# dependency change.
#
# Triggered by a change to package.json or to this file, NOT only by workflow_dispatch:
# GitHub offers manual dispatch only for workflows on the DEFAULT branch, which here is
# main -- the legacy single-file app. Dispatch starts working when main is retired.
on:
  push:
    branches:
      - development
    paths:
      - 'package.json'
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the Function App runs and the deploy workflows build with.
          # Resolving against a different major would produce a lockfile that is
          # correct for a Node nobody uses here.
          node-version: 22

      - name: Regenerate
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      # The whole point. If npm ci still fails, the new lockfile is no better than the
      # old one and must not be proposed as a fix.
      - name: Prove npm ci works with it
        run: npm ci

      - name: Prove the app still builds
        run: npm run build

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-lockfile
          title: 'Regenerate package-lock.json on Linux'
          commit-message: |
            Regenerate package-lock.json on Linux

            npm ci failed on the runner with "Missing @emnapi/core from lock file"
            while passing locally on a clean Windows tree: the committed lockfile was
            resolved on Windows and omits entries a Linux install needs.

            Regenerating on Windows does not fix it and made it worse — @emnapi/runtime
            vanished and core resolved to 1.11.1 rather than the 1.11.3 the runner
            asked for. So this is generated on ubuntu-latest, and the job proves it by
            running npm ci and a build against the result before proposing it.
          body: |
            Generated by `.github/workflows/refresh-lockfile.yml` on `ubuntu-latest`.

            **Why:** `npm ci` fails on the runner (`Missing @emnapi/core@1.11.3 from
            lock file`) while passing locally on a clean Windows tree. The lockfile was
            resolved on Windows and omits entries a Linux install needs. Regenerating
            on Windows makes it worse.

            **Verified in this job before the PR was opened:** `npm ci` succeeds and
            `npm run build` succeeds against the regenerated lockfile.

            **Check before merging:** the diff should be resolution changes only — no
            new top-level dependencies, and no version jumps in `package.json`.
